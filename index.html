<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>SUPCON Nyx通用控制系统 · 三维爆炸图 | 3D Exploded View</title>
<style>
  :root{--accent:#3fb6ff;--accent2:#00e5ff;--panel:rgba(12,20,34,.72);--line:rgba(80,170,255,.28);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:#dce8f5;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 35%,#1b2638 0%,#0c111b 55%,#05070b 100%);}
  #app{position:fixed;inset:0}
  #app canvas{display:block;outline:none}
  .label-layer{position:absolute;top:0;left:0;pointer-events:none}
  header{position:fixed;left:24px;top:18px;pointer-events:none;z-index:5}
  header h1{margin:0;font-size:22px;font-weight:600;letter-spacing:1px}
  header h1 b{color:var(--accent)}
  header p{margin:4px 0 0;font-size:12px;color:#8ea4bd;letter-spacing:.5px}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #legend{position:fixed;left:24px;top:92px;width:230px;padding:12px;z-index:5}
  #legend h3{margin:0 0 8px;font-size:12px;font-weight:500;color:#8ea4bd;letter-spacing:1px}
  .lg{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .2s}
  .lg:hover,.lg.active{background:rgba(63,182,255,.14)}
  .lg i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .lg .t{font-size:14px;line-height:1.2}
  .lg .t small{display:block;font-size:11px;color:#8ea4bd}
  .lg .n{margin-left:auto;font-size:11px;color:#8ea4bd}
  #info{position:fixed;right:24px;top:92px;width:310px;padding:18px 18px 14px;z-index:6;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
  #info.hidden{transform:translateX(30px);opacity:0;pointer-events:none}
  #info .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(63,182,255,.18);color:var(--accent);margin-bottom:8px}
  #info h2{margin:0;font-size:19px;font-weight:600}
  #info h4{margin:2px 0 10px;font-size:12px;color:#8ea4bd;font-weight:400}
  #info p{font-size:13px;line-height:1.65;color:#c3d3e4;margin:0 0 10px}
  #info table{width:100%;border-collapse:collapse;font-size:12.5px}
  #info td{padding:6px 0;border-top:1px solid rgba(255,255,255,.07);vertical-align:top}
  #info td:first-child{color:#8ea4bd;width:78px}
  #info .note{font-size:11px;color:#6d8199;margin-top:8px}
  #info .close{position:absolute;right:12px;top:10px;background:none;border:0;color:#8ea4bd;font-size:20px;cursor:pointer}
  #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;width:max-content;justify-content:center;max-width:calc(100vw - 24px)}
  #controls button{font:inherit;font-size:13px;color:#dce8f5;background:rgba(255,255,255,.06);border:1px solid rgba(120,180,255,.25);
    padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
  #controls button small{color:#8ea4bd;font-size:10.5px;margin-left:4px}
  #controls button:hover{background:rgba(63,182,255,.18);border-color:var(--accent)}
  #controls button.on{background:linear-gradient(135deg,#1f8fff,#00c6ff);border-color:transparent;color:#fff}
  #controls button.on small{color:#e6f6ff}
  .sl{display:flex;align-items:center;gap:8px;font-size:12px;color:#8ea4bd}
  input[type=range]{-webkit-appearance:none;appearance:none;width:210px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(255,255,255,.15) var(--p,0%));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(63,182,255,.35);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;cursor:pointer}
  #pct{width:40px;text-align:right;color:#dce8f5;font-variant-numeric:tabular-nums}
  #hint{position:fixed;right:24px;bottom:28px;font-size:11px;color:#6d8199;z-index:4;pointer-events:none;text-align:right}
  #tip{position:fixed;pointer-events:none;z-index:7;padding:6px 10px;font-size:12px;border-radius:6px;background:rgba(5,12,22,.85);
    border:1px solid var(--line);white-space:nowrap;opacity:0;transition:opacity .15s}
  #tip small{color:#8ea4bd;margin-left:6px}
  .glabel{width:0;height:0;position:relative}
  .glabel .in{position:absolute;left:0;top:0;transform:translateY(-50%);display:flex;align-items:center;pointer-events:auto;cursor:pointer;white-space:nowrap}
  .glabel .ln{width:46px;height:1px;background:linear-gradient(90deg,rgba(63,182,255,0),var(--accent))}
  .glabel .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:10px}
  .glabel .card{padding:6px 12px 7px;border-left:2px solid var(--accent);background:linear-gradient(90deg,rgba(15,35,60,.75),rgba(15,35,60,0));}
  .glabel .cn{font-size:17px;font-weight:600;color:#fff;letter-spacing:1px;text-shadow:0 0 12px rgba(0,0,0,.6)}
  .glabel .en{font-size:12px;color:#9fc4e6;letter-spacing:.5px}
  .glabel .in:hover .card{background:linear-gradient(90deg,rgba(30,90,150,.8),rgba(15,35,60,0))}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;
    background:#070a10;color:#8ea4bd;font-size:13px;transition:opacity .6s}
  #loading .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(63,182,255,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:820px){
    header h1{font-size:17px} header{left:14px;top:12px}
    #legend{display:none}
    #info{left:12px;right:12px;top:auto;bottom:118px;width:auto;max-height:42vh;overflow:auto}
    #hint{display:none}
    input[type=range]{width:150px}
    .glabel .cn{font-size:13px} .glabel .en{font-size:10px} .glabel .ln{width:18px}
  }
</style>

<body>
<div id="app"></div>
<header>
  <h1><b>SUPCON</b> Nyx通用控制系统 · 三维爆炸图</h1>
  <p>Industrial Control Cabinet · Interactive 3D Exploded View</p>
</header>
<div id="legend" class="glass"><h3>部件分组 · COMPONENTS</h3><div id="lgList"></div></div>
<div id="info" class="glass hidden">
  <button class="close" id="infoClose" aria-label="close">×</button>
  <span class="tag" id="iTag"></span>
  <h2 id="iName"></h2><h4 id="iEn"></h4>
  <p id="iDesc"></p>
  <table id="iSpecs"></table>
  <div class="note">* 参数为示意说明 · Illustrative specs only</div>
</div>
<div id="controls" class="glass">
  <button id="bExplode">展开<small>Explode</small></button>
  <button id="bAssemble">合拢<small>Assemble</small></button>
  <button id="bAuto">自动演示<small>Auto</small></button>
  <div class="sl"><span>爆炸 Explode</span><input id="slider" type="range" min="0" max="100" step="0.1" value="0"><span id="pct">0%</span></div>
  <button id="bReset">复位视角<small>Reset</small></button>

<div id="tip"></div>
<div id="loading"><div class="sp"></div><div id="loadMsg">正在加载三维场景… Loading 3D scene…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ------------------------------------------------------------------ renderer / scene */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.className = 'label-layer';
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.9;
const HOME_TARGET = new THREE.Vector3(0.05, 1.12, 0);
const HOME_DIR = new THREE.Vector3(-2.35, 0.75, 3.25).normalize();
const frameDist = p => (4.5 + 1.5 * p) * Math.max(1, 1.05 / (innerWidth / innerHeight));
const frameY = p => 1.05 + 0.2 * p;
let framedP = 0;
function homeCamera() {
  const dist = frameDist(framedP);
  controls.target.copy(HOME_TARGET); controls.target.y = frameY(framedP);
  if (innerWidth < innerHeight) controls.target.x = 0.5;
  camera.position.copy(HOME_TARGET).addScaledVector(HOME_DIR, dist);
  controls.update();
}
homeCamera();

/* lights */
scene.add(new THREE.HemisphereLight(0xb0c8ff, 0x07090d, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(-3, 5.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3.2, bottom: -2, near: 0.5, far: 16 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key);
const rim = new THREE.DirectionalLight(0x5a9dff, 0.9); rim.position.set(4, 1.2, -4); scene.add(rim);
const blue = new THREE.PointLight(0x2f86ff, 5, 5, 2); blue.position.set(-1.2, 0.4, 1.6); scene.add(blue);

/* ------------------------------------------------------------------ helpers */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, a, b) => easeInOutCubic(clamp((t - a) / (b - a)));
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function mkTex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t; }
function rrect(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function vgrad(x, y0, y1, stops) { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function hole(x, cx, cy, r) { x.fillStyle = '#2a2c30'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.arc(cx, cy + 1, r * .45, 0, 7); x.fill(); }
function led(x, xe, cx, cy, r, color, on = true) {
  x.fillStyle = on ? color : '#333'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  if (on && xe) { xe.fillStyle = color; xe.shadowColor = color; xe.shadowBlur = r * 3; xe.beginPath(); xe.arc(cx, cy, r, 0, 7); xe.fill(); xe.shadowBlur = 0; }
}
function ear(x, X, w, H, col = '#868b93') { x.fillStyle = vgrad(x, 0, H, ['#9aa0a8', col, '#6c7178']); x.fillRect(X, 0, w, H); x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(X + (X ? 0 : w - 2), 0, 2, H); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ------------------------------------------------------------------ procedural textures */
function sideWaveTexture() {
  const W = 1024, H = 2048, [c, x] = mkCanvas(W, H);
  x.fillStyle = vgrad(x, 0, H, ['#1b1d22', '#141619', '#0f1013']); x.fillRect(0, 0, W, H);
  // brushed noise
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(255,255,255,${rnd() * .025})`; x.fillRect(rnd() * W, rnd() * H, rnd() * 40, 1); }
  const ribbon = (pts, c0, c1, alpha = 1) => {
    const g = x.createLinearGradient(0, 0, W * .5, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
    x.globalAlpha = alpha; x.fillStyle = g; x.beginPath(); x.moveTo(...pts[0]);
    let i = 1; for (; i + 2 < pts.length; i += 3) x.bezierCurveTo(...pts[i], ...pts[i + 1], ...pts[i + 2]);
    for (; i < pts.length; i++) x.lineTo(...pts[i]);
    x.closePath(); x.fill(); x.globalAlpha = 1;
  };
  x.shadowColor = 'rgba(30,140,255,.6)'; x.shadowBlur = 40;
  // big rear ribbon (left edge of texture = rear of cabinet)
  ribbon([[0, 100], [300, 260], [380, 700], [150, 1020], [-40, 1260], [40, 1560], [300, 1820],
    [200, 1880], [-90, 1560], [-110, 1220], [40, 1010], [230, 720], [170, 330], [0, 240]], '#1d74e0', '#0d3f91');
  ribbon([[0, 300], [180, 420], [230, 760], [70, 1020], [-30, 1180], [-10, 1300], [0, 1330],
    [0, 1200], [10, 1090], [10, 1010], [120, 760], [110, 480], [0, 380]], '#3cc4ff', '#1b6fd6', .95);
  ribbon([[0, 1480], [140, 1580], [240, 1780], [160, 2048], [60, 2048], [120, 1780], [40, 1620], [0, 1580]], '#2a9cff', '#0f4fae', .9);
  // front-bottom ribbon (right edge = front)
  ribbon([[W, 1320], [820, 1480], [700, 1760], [780, 2048], [900, 2048], [830, 1780], [900, 1540], [W, 1440]], '#38bcff', '#155fc4');
  ribbon([[W, 1560], [930, 1660], [880, 1860], [940, 2048], [990, 2048], [950, 1880], [980, 1720], [W, 1660]], '#7fdcff', '#2a8cf0', .8);
  x.shadowBlur = 0;
  // logo
  x.save(); x.translate(600, 420); x.font = '600 132px "Arial","Helvetica",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lg = x.createLinearGradient(0, -60, 0, 60); lg.addColorStop(0, '#f4f6f8'); lg.addColorStop(.5, '#b9c0c8'); lg.addColorStop(1, '#8a929b');
  x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 8; x.shadowOffsetY = 3;
  x.fillStyle = lg; if ('letterSpacing' in x) x.letterSpacing = '8px'; x.fillText('SUPCON', 0, 0); x.restore();
  return mkTex(c);
}

const DASH_W = 512, DASH_H = 1780;
const [dashCanvas, dashCtx] = mkCanvas(DASH_W, DASH_H);
function drawDashboard(t) {
  const x = dashCtx, W = DASH_W, H = DASH_H;
  x.clearRect(0, 0, W, H);
  x.fillStyle = vgrad(x, 0, H, ['#03101f', '#05182f', '#041226']); x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(40,120,220,.08)'; x.lineWidth = 1;
  for (let i = 0; i < W; i += 24) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
  for (let i = 0; i < H; i += 24) { x.beginPath(); x.moveTo(0, i); x.lineTo(W, i); x.stroke(); }
  const cyan = '#3fd2ff', blue = '#2a8cff';
  const panel = (X, Y, w, h, title) => {
    x.fillStyle = 'rgba(20,90,170,.16)'; x.fillRect(X, Y, w, h);
    x.strokeStyle = 'rgba(70,170,255,.5)'; x.lineWidth = 1.5; x.strokeRect(X, Y, w, h);
    x.fillStyle = 'rgba(40,140,255,.28)'; x.fillRect(X, Y, w, 22);
    x.fillStyle = cyan; x.fillRect(X, Y, 4, 22);
    x.font = 'bold 13px Arial'; x.fillStyle = '#bfefff'; x.textBaseline = 'middle'; x.fillText(title, X + 12, Y + 11);
    x.strokeStyle = cyan; x.lineWidth = 3;
    [[X, Y + h, 1, -1], [X + w, Y + h, -1, -1], [X + w, Y, -1, 1]].forEach(([a, b, sx, sy]) => { x.beginPath(); x.moveTo(a + sx * 14, b); x.lineTo(a, b); x.lineTo(a, b + sy * 14); x.stroke(); });
  };
  const glow = (on, col = cyan) => { x.shadowColor = col; x.shadowBlur = on ? 10 : 0; };
  const gauge = (cx, cy, r, v, label, col = cyan) => {
    x.lineWidth = 7; x.strokeStyle = 'rgba(60,140,255,.18)'; x.beginPath(); x.arc(cx, cy, r, Math.PI * .75, Math.PI * 2.25); x.stroke();
    glow(true, col); x.strokeStyle = col; x.beginPath(); x.arc(cx, cy, r, Math.PI * .75, Math.PI * (.75 + 1.5 * v)); x.stroke(); glow(false);
    x.lineWidth = 1; x.strokeStyle = 'rgba(120,200,255,.35)'; x.beginPath(); x.arc(cx, cy, r - 12, 0, 7); x.stroke();
    x.textAlign = 'center'; x.fillStyle = '#e8fbff'; x.font = 'bold 20px Arial'; x.fillText(Math.round(v * 100) + '%', cx, cy);
    x.font = '11px Arial'; x.fillStyle = '#7fb8e6'; x.fillText(label, cx, cy + r + 14); x.textAlign = 'left';
  };
  const s = t * 0.001;
  // header
  x.fillStyle = 'rgba(40,140,255,.25)'; x.fillRect(0, 0, W, 40);
  glow(true); x.fillStyle = '#e6faff'; x.font = 'bold 18px Arial'; x.textBaseline = 'middle'; x.fillText('SUPCON  ·  CABINET MONITOR', 14, 20); glow(false);
  x.font = '12px Arial'; x.fillStyle = '#7fb8e6'; x.textAlign = 'right'; x.fillText(new Date().toTimeString().slice(0, 8), W - 12, 20); x.textAlign = 'left';
  // gauges
  panel(12, 52, 488, 200, 'SYSTEM STATUS');
  ['CPU', 'MEM', 'NET', 'DISK'].forEach((n, i) => gauge(73 + i * 122, 150, 38, .35 + .4 * (0.5 + 0.5 * Math.sin(s * .7 + i * 1.7)), n, i == 3 ? '#5dffb1' : cyan));
  // device list
  panel(12, 264, 488, 250, 'DEVICE LIST');
  const rows = ['TSN-SW-01', 'TSN-SW-02', 'SRV-NODE-01', 'SRV-NODE-02', 'SRV-NODE-03', 'UPS-01', 'UPS-02', 'COOL-01'];
  rows.forEach((n, i) => {
    const y = 302 + i * 26; x.font = '12px Arial'; x.fillStyle = '#a9d8ff'; x.fillText(n, 24, y);
    const ok = !(i == 5 && Math.sin(s) > .6); x.fillStyle = ok ? '#4dffa0' : '#ffb347'; x.beginPath(); x.arc(140, y, 4, 0, 7); x.fill();
    x.fillStyle = 'rgba(60,140,255,.18)'; x.fillRect(160, y - 5, 230, 10);
    const v = .3 + .6 * (0.5 + 0.5 * Math.sin(s * 1.3 + i * 2.1)); x.fillStyle = vgrad(x, y - 5, y + 5, ['#6fe2ff', '#1b7fff']); x.fillRect(160, y - 5, 230 * v, 10);
    x.fillStyle = '#d6f3ff'; x.fillText((v * 100).toFixed(1) + '%', 402, y);
  });
  // topology
  panel(12, 526, 488, 330, 'TSN TOPOLOGY');
  const hexes = [[110, 640], [256, 600], [402, 640], [110, 770], [256, 730], [402, 770]];
  x.strokeStyle = 'rgba(80,190,255,.6)'; x.lineWidth = 2;
  [[0, 1], [1, 2], [0, 4], [2, 4], [3, 4], [4, 5], [1, 4]].forEach(([a, b]) => { x.beginPath(); x.moveTo(...hexes[a]); x.lineTo(...hexes[b]); x.stroke(); });
  hexes.forEach(([cx, cy], i) => {
    x.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; x.lineTo(cx + 34 * Math.cos(a), cy + 34 * Math.sin(a)); } x.closePath();
    x.fillStyle = 'rgba(20,80,160,.55)'; x.fill(); glow(true); x.strokeStyle = i == 4 ? '#ffffff' : cyan; x.lineWidth = 2.5; x.stroke(); glow(false);
    const cols = ['#ff5a6a', '#4db8ff', '#ffffff']; for (let k = 0; k < 3; k++) { x.fillStyle = cols[(k + i) % 3]; x.beginPath(); x.arc(cx - 12 + k * 12, cy + 4, 5, 0, 7); x.fill(); }

  const art = addPart(shell, new THREE.PlaneGeometry(pd, ph), sideArtMat, sx * (CW / 2 - 0.0015 + 0.0001), pcy, 0, shell);
  art.rotation.y = sx * Math.PI / 2; art.castShadow = false;
}
addPart(shell, B(CW - 0.04, ph, 0.012), panelMat, 0, pcy, -CD / 2 + 0.008, shell); // back
for (const sx of [-1, 1]) for (const z of [0.4, -0.38]) addPart(shell, B(0.02, CH - 0.25, 0.03), railMat, sx * 0.272, Y0 + 0.1 + (CH - 0.25) / 2, z, shell); // rack posts
// casters
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.7, metalness: 0.1 });
const forkMat = new THREE.MeshStandardMaterial({ color: 0x8a9098, roughness: 0.3, metalness: 0.9 });
const wheelGeo = new THREE.CylinderGeometry(0.032, 0.032, 0.026, 24); wheelGeo.rotateZ(Math.PI / 2);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const x0 = sx * (CW / 2 - 0.07), z0 = sz * (CD / 2 - 0.09);
  addPart(shell, B(0.07, 0.008, 0.07), forkMat, x0, Y0 - 0.004, z0, shell);
  addPart(shell, B(0.04, 0.04, 0.03), forkMat, x0, Y0 - 0.025, z0, shell);
  addPart(shell, wheelGeo, wheelMat, x0, 0.032, z0 + 0.012, shell);
}
// door
const door = new THREE.Group(); door.userData.info = DOOR_INFO;
door.position.set(CW / 2 - 0.005, Y0 + 0.11, CD / 2); shell.add(door);
const DW = CW - 0.01, DH = CH - 0.17, DT = 0.025, sL = 0.085, sR = 0.035, rT = 0.06, rB = 0.11;
const doorMat = new THREE.MeshStandardMaterial({ color: 0x15161a, metalness: 0.65, roughness: 0.38 });
addPart(door, B(sL, DH, DT), doorMat, -DW + sL / 2, DH / 2, DT / 2, door);
addPart(door, B(sR, DH, DT), doorMat, -sR / 2, DH / 2, DT / 2, door);
addPart(door, B(DW - sL - sR, rT, DT), doorMat, -DW + sL + (DW - sL - sR) / 2, DH - rT / 2, DT / 2, door);
addPart(door, B(DW - sL - sR, rB, DT), doorMat, -DW + sL + (DW - sL - sR) / 2, rB / 2, DT / 2, door);
const GW = DW - sL - sR, GH = DH - rT - rB, gcx = -DW + sL + GW / 2, gcy = rB + GH / 2;
const dashTex = mkTex(dashCanvas); drawDashboard(0); dashTex.needsUpdate = true;
const dashMat = new THREE.MeshBasicMaterial({ map: dashTex, toneMapped: false, transparent: true, opacity: 0.94 });
const dash = addPart(door, new THREE.PlaneGeometry(GW - 0.02, GH - 0.02), dashMat, gcx, gcy, 0.01, door); dash.castShadow = false;
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xaaccee, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.16, clearcoat: 1, envMapIntensity: 1.6, depthWrite: false });
const glass = addPart(door, new THREE.PlaneGeometry(GW, GH), glassMat, gcx, gcy, DT - 0.002, door); glass.castShadow = false;
// handle + module
const handleMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0e, metalness: 0.8, roughness: 0.25 });
addPart(door, B(0.04, 0.17, 0.01), handleMat, -DW + sL / 2, DH * 0.56, DT + 0.005, door);
addPart(door, B(0.022, 0.12, 0.03), handleMat, -DW + sL / 2, DH * 0.56, DT + 0.02, door);
const modMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, metalness: 0.3, roughness: 0.1, emissive: 0x0a2a55, emissiveIntensity: 0.6 });
addPart(door, B(0.055, 0.14, 0.012), modMat, -DW + sL / 2, DH * 0.72, DT + 0.006, door);
const shellMats = new Set();
shell.traverse(o => { if (o.isMesh) shellMats.add(o.material); });
shellMats.forEach(m => { m.userData.baseOpacity = m.opacity; m.userData.baseTransparent = m.transparent; m.userData.baseDepthWrite = m.depthWrite; });

/* ------------------------------------------------------------------ devices */
const DEV_W = 0.5, DEV_D = 0.78, DEV_Z = CD / 2 - 0.06 - DEV_D / 2;
const T = { switch: switchFront(), server: serverFront(), ups: upsFront(false), upsCtrl: upsFront(true), cooling: coolingFront() };
const frontMats = [];
function makeMats(tex, sideColor, metal = 0.75, rough = 0.38) {
  const side = new THREE.MeshStandardMaterial({ color: sideColor, metalness: metal, roughness: rough });
  const front = new THREE.MeshStandardMaterial({ map: tex[0], emissiveMap: tex[1], emissive: 0xffffff, emissiveIntensity: 1.6, metalness: 0.5, roughness: 0.42 });
  frontMats.push(front);
  return [side, side, side, side, front, side];
}
const MATS = {
  switch: makeMats(T.switch, 0x2a2d32), server: makeMats(T.server, 0xa9aeb5, 0.85, 0.32),
  ups: makeMats(T.ups, 0x1c1e22), upsCtrl: makeMats(T.upsCtrl, 0x1c1e22), cooling: makeMats(T.cooling, 0x25272b),
};
const handleGeo = B(0.012, 1, 0.022);
const groups = [];
let yTop = Y0 + CH - 0.2;
for (const def of GROUP_DEF) {
  const height = def.n * def.h + (def.n - 1) * def.gap;
  const obj = new THREE.Group(); obj.position.set(0, yTop - height / 2, DEV_Z); scene.add(obj);
  const g = { ...def, obj, base: obj.position.clone(), items: [] };
  obj.userData.info = { tag: `分组 Group · ${def.n} 台`, cn: def.cn, en: def.en, desc: def.desc, specs: def.specs };
  const geo = B(DEV_W, def.h, DEV_D);
  for (let i = 0; i < def.n; i++) {
    const dev = new THREE.Group();
    const ly = height / 2 - def.h / 2 - i * (def.h + def.gap);
    dev.position.y = ly; dev.userData.baseY = ly;
    dev.userData.info = ITEM_INFO[def.key](i);
    const mats = def.key === 'ups' && i === 3 ? MATS.upsCtrl : MATS[def.key];
    addPart(dev, geo, mats, 0, 0, 0, dev);
    if (def.key === 'server') for (const sx of [-1, 1]) { const hm = addPart(dev, handleGeo, MATS.server[0], sx * (DEV_W / 2 - 0.02), 0, DEV_D / 2 + 0.011, dev); hm.scale.y = def.h * 0.7; }
    obj.add(dev); g.items.push(dev);
  }
  // label
  const el = document.createElement('div'); el.className = 'glabel';
  el.innerHTML = `<div class="in"><div class="ln"></div><div class="dot" style="background:${def.color};box-shadow:0 0 10px ${def.color}"></div><div class="card" style="border-color:${def.color}"><div class="cn">${def.cn}</div><div class="en">${def.en}</div></div></div>`;
  el.querySelector('.in').addEventListener('click', e => { e.stopPropagation(); select(obj); });
  const label = new CSS2DObject(el); label.position.set(DEV_W / 2 + 0.04, 0, 0); obj.add(label);
  g.label = label; g.el = el;
  groups.push(g);
  yTop -= height + 0.03;
}

/* ------------------------------------------------------------------ highlight overlays */
function makeOverlay(color, fillOpacity) {
  const o = new THREE.Group();
  o.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: fillOpacity, depthWrite: false })));
  o.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.95 })));
  o.visible = false; o.renderOrder = 10; scene.add(o); return o;
}
const hoverOv = makeOverlay(0x5fc8ff, 0.08), selOv = makeOverlay(0x00e5ff, 0.14);
const _box = new THREE.Box3(), _c = new THREE.Vector3(), _s = new THREE.Vector3();
function updateOverlay(ov, target) {
  if (!target || (isShellOwner(target) && shellOpacity < 0.3)) { ov.visible = false; return; }
  _box.setFromObject(target); _box.getCenter(_c); _box.getSize(_s);
  ov.position.copy(_c); ov.scale.copy(_s).addScalar(0.014); ov.visible = true;
}
const isShellOwner = o => o === shell || o === door;

/* ------------------------------------------------------------------ explode logic */
let shellOpacity = 1, shellShadow = true;
function setShellOpacity(o) {
  if (Math.abs(o - shellOpacity) < 1e-4) return;
  shellOpacity = o;
  shellMats.forEach(m => {
    m.opacity = m.userData.baseOpacity * o;
    const tr = m.userData.baseTransparent || o < 0.999;
    if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
    m.depthWrite = m.userData.baseTransparent ? m.userData.baseDepthWrite : o > 0.6;
  });
  shell.visible = o > 0.005;
  const sh = o > 0.5; if (sh !== shellShadow) { shellShadow = sh; shell.traverse(m => { if (m.isMesh && m !== dash && m !== glass && !m.geometry.type.startsWith('Plane')) m.castShadow = sh; }); }
}
function applyExplode(t) {
  door.rotation.y = seg(t, 0, 0.3) * THREE.MathUtils.degToRad(108);
  const lift = seg(t, 0.2, 0.56);
  shell.position.set(0, lift * 1.1, -lift * 0.5);
  setShellOpacity(1 - seg(t, 0.24, 0.52));
  for (const g of groups) {
    const e = seg(t, g.win[0], g.win[1]);
    g.obj.position.copy(g.base).addScaledVector(g.offset, e);
    g.items.forEach((d, i) => { d.position.y = d.userData.baseY + ((g.n - 1) / 2 - i) * 0.05 * e; });
    const lo = clamp((e - 0.55) / 0.45);
    g.el.style.opacity = lo; g.el.style.visibility = lo > 0.01 ? 'visible' : 'hidden';
  }
}

/* ------------------------------------------------------------------ UI state */
const $ = id => document.getElementById(id);
const slider = $('slider'), pct = $('pct'), bAuto = $('bAuto');
let progress = 0, tween = null, auto = false, autoStart = 0, dragging = false;
const clock = new THREE.Clock();
function animateTo(to) { stopAuto(); tween = { from: progress, to, start: clock.getElapsedTime(), dur: 0.4 + 3.4 * Math.abs(to - progress) }; }
function stopAuto() { auto = false; controls.autoRotate = false; bAuto.classList.remove('on'); }
function startAuto() { tween = null; auto = true; controls.autoRotate = true; bAuto.classList.add('on'); autoStart = clock.getElapsedTime() - progress * 3.8; }
$('bExplode').onclick = () => animateTo(1);
$('bAssemble').onclick = () => animateTo(0);
bAuto.onclick = () => auto ? stopAuto() : startAuto();
$('bReset').onclick = () => { homeCamera(); };
slider.addEventListener('input', () => { stopAuto(); tween = null; progress = slider.value / 100; });
slider.addEventListener('pointerdown', () => dragging = true);
window.addEventListener('pointerup', () => dragging = false);
function syncSlider() {
  if (!dragging) slider.value = (progress * 100).toFixed(1);
  slider.style.setProperty('--p', (progress * 100) + '%'); pct.textContent = Math.round(progress * 100) + '%';
}
// legend
const lgList = $('lgList');
groups.forEach(g => {
  const d = document.createElement('div'); d.className = 'lg';
  d.innerHTML = `<i style="color:${g.color};background:${g.color}"></i><div class="t">${g.cn}<small>${g.en}</small></div><span class="n">×${g.n}</span>`;
  d.onclick = () => select(g.obj); d.onmouseenter = () => { legendHover = g.obj; }; d.onmouseleave = () => { legendHover = null; };
  g.lg = d; lgList.appendChild(d);
});
{ const d = document.createElement('div'); d.className = 'lg'; d.innerHTML = `<i style="color:#8a9bb0;background:#8a9bb0"></i><div class="t">机柜外壳<small>Cabinet Shell</small></div>`;
  d.onclick = () => { if (progress > 0.4) animateTo(0); select(shell); }; lgList.appendChild(d); }

// info panel
let selected = null, hovered = null, legendHover = null;
function select(obj) {
  selected = obj;
  groups.forEach(g => g.lg.classList.toggle('active', g.obj === obj));
  if (!obj) { $('info').classList.add('hidden'); return; }
  const i = obj.userData.info;
  $('iTag').textContent = i.tag; $('iName').textContent = i.cn; $('iEn').textContent = i.en; $('iDesc').textContent = i.desc;
  $('iSpecs').innerHTML = i.specs.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  $('info').classList.remove('hidden');
}
$('infoClose').onclick = () => select(null);

/* picking */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('tip');
let lastMove = null, downPos = null;
function pickAt(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  for (const h of raycaster.intersectObjects(pickables, false)) {
    const owner = h.object.userData.owner;
    if (!owner) continue;
    if (isShellOwner(owner) && shellOpacity < 0.5) continue;
    return owner;
  }
  return null;
}
renderer.domElement.addEventListener('pointermove', e => { lastMove = e; });
renderer.domElement.addEventListener('pointerleave', () => { lastMove = null; hovered = null; tip.style.opacity = 0; });
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
  select(pickAt(e.clientX, e.clientY));
});
function updateHover() {
  if (!lastMove) return;
  const e = lastMove; lastMove = null;
  if (e.pointerType === 'touch') return;
  hovered = pickAt(e.clientX, e.clientY);
  renderer.domElement.style.cursor = hovered ? 'pointer' : '';
  if (hovered) {
    const i = hovered.userData.info; tip.innerHTML = `${i.cn}<small>${i.en}</small>`;
    tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; tip.style.opacity = 1;
  } else tip.style.opacity = 0;
}

/* resize */
let portrait = innerWidth < innerHeight;
window.addEventListener('resize', () => {
  if ((innerWidth < innerHeight) !== portrait) { portrait = !portrait; setTimeout(homeCamera, 0); }
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------------ loop */
let lastDash = 0, frames = 0;
function loop() {
  const t = clock.getElapsedTime();
  if (auto) {
    const p = (t - autoStart) % 11;
    progress = p < 3.8 ? p / 3.8 : p < 6 ? 1 : p < 9.8 ? 1 - (p - 6) / 3.8 : 0;
  } else if (tween) {
    const k = clamp((t - tween.start) / tween.dur);
    progress = tween.from + (tween.to - tween.from) * k;
    if (k >= 1) tween = null;
  }
  applyExplode(progress); syncSlider();
  if (progress !== framedP) { // gentle auto-framing: dolly out / raise target as parts spread, keeps user's zoom ratio
    const f = frameDist(progress) / frameDist(framedP), dy = frameY(progress) - frameY(framedP);
    camera.position.sub(controls.target).multiplyScalar(f).add(controls.target);
    controls.target.y += dy; camera.position.y += dy; framedP = progress;
  }
  updateHover();
  updateOverlay(hoverOv, legendHover || (hovered !== selected ? hovered : null));
  updateOverlay(selOv, selected);
  frontMats.forEach((m, i) => { m.emissiveIntensity = 1.4 + 0.35 * Math.sin(t * (2 + i) + i); });
  if (t - lastDash > 1.5 && shell.visible) { lastDash = t; drawDashboard(t * 1000); dashTex.needsUpdate = true; }
  ring.material.opacity = 0.25 + 0.12 * Math.sin(t * 1.5);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (++frames === 2) { const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); window.__ready = true; }
  requestAnimationFrame(loop);
}
loop();

// test / automation hook
window.__setExplode = p => { stopAuto(); tween = null; progress = clamp(p); };
window.__select = name => { const g = groups.find(g => g.key === name); select(g ? g.obj : null); };
</script>
<script>
  window.addEventListener('error', e => { const m = document.getElementById('loadMsg'); if (m) m.textContent = '加载失败 Load error: ' + (e.message || e); });
</script>
